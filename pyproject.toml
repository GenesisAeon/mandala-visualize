[project]
name = "mandala-visualizer"
version = "1.0.0"
description = "The visual mandala renderer for the GenesisAeon stack – Climate Dashboard, Cosmic-Web, Mermaid/Grafana integration and fraktal MandalaMap visuals."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE-CODE"]
authors = [{ name = "GenesisAeon Team", email = "team@genesisaeon.org" }]
keywords = ["mandala", "visualization", "climate", "cosmic-web", "fractal", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8.0",
    "networkx>=3.3",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
stack = [
    "utac-core>=0.1.0",
    "sigillin>=0.1.0",
    "field-theory>=0.1.0",
    "cosmic-moment>=0.1.0",
    "medium-modulation>=0.1.0",
    "entropy-governance>=0.1.0",
    "entropy-table>=2.0.0",
    "implosive-genesis>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-networkx>=3.3",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=0.27",
    "mkdocs-material>=9.6",
]

[project.scripts]
mviz = "mandala_visualizer.cli:app"

[project.urls]
Repository = "https://github.com/GenesisAeon/mandala-visualizer"
Issues = "https://github.com/GenesisAeon/mandala-visualizer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandala_visualizer"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mandala_visualizer --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

# Override non-PyPI stack packages with impossible markers so uv can lock
# without requiring them. They are still declared in [stack] for pip users.
[tool.uv]
override-dependencies = [
    "utac-core>=0.1.0 ; python_version < '0'",
    "sigillin>=0.1.0 ; python_version < '0'",
    "field-theory>=0.1.0 ; python_version < '0'",
    "cosmic-moment>=0.1.0 ; python_version < '0'",
    "medium-modulation>=0.1.0 ; python_version < '0'",
    "entropy-governance>=0.1.0 ; python_version < '0'",
    "entropy-table>=2.0.0 ; python_version < '0'",
    "implosive-genesis>=1.0.0 ; python_version < '0'",
]

